{% extends "base.html" %}

{% block title %}Sign In - Civic Connects{% endblock %}

{% block content %}
<div class="auth-wrapper">
  <div class="auth-container">
    
    <!-- Top Brand Header -->
    <div class="auth-header">
      <div class="brand-logo-container">
        <!-- Modern Civic Shield / Landmark Icon -->
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path>
          <path d="M9 12l2 2 4-4"></path>
        </svg>
      </div>
      <h1>Civic Connects</h1>
      <p class="tagline">Report · Track · Resolve</p>
    </div>

    <!-- Interactive Role Toggle Component -->
    <div class="role-toggle-container" role="tablist" aria-label="Portal Role Selection">
      <button type="button" 
              class="role-toggle-btn {% if not role or role == 'citizen' %}active{% endif %}" 
              data-role="citizen"
              id="roleToggleCitizen">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
          <circle cx="12" cy="7" r="4"></circle>
        </svg>
        <span>Citizen</span>
      </button>

      <button type="button" 
              class="role-toggle-btn {% if role == 'admin' %}active{% endif %}" 
              data-role="admin"
              id="roleToggleAdmin">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="2" y="3" width="20" height="14" rx="2" ry="2"></rect>
          <line x1="8" y1="21" x2="16" y2="21"></line>
          <line x1="12" y1="17" x2="12" y2="21"></line>
        </svg>
        <span>Admin / Authority</span>
      </button>
    </div>

    <!-- Login Form -->
    <form action="{{ url_for('auth.login') }}" method="POST" id="loginForm" novalidate>
      <input type="hidden" name="role" id="roleInput" value="{{ role or 'citizen' }}">

      <!-- Email Input -->
      <div class="form-group">
        <label for="loginEmail" class="form-label">Email Address <span class="required">*</span></label>
        <input type="email" 
               id="loginEmail" 
               name="email" 
               class="form-control" 
               placeholder="name@example.com" 
               value="{{ email or '' }}" 
               required 
               autocomplete="email">
      </div>

      <!-- Password Input with Eye Toggle -->
      <div class="form-group">
        <div style="display: flex; justify-content: space-between; align-items: center;">
          <label for="loginPassword" class="form-label">Password <span class="required">*</span></label>
          <a href="#" onclick="alert('For demo recovery, use credentials:\nAdmin: admin@civicconnects.gov / Admin@123\nCitizen: citizen@example.com / Citizen@123'); return false;" class="form-hint" style="color: var(--brand-blue); font-weight: 500;">Forgot Password?</a>
        </div>
        <div class="input-with-icon">
          <input type="password" 
                 id="loginPassword" 
                 name="password" 
                 class="form-control" 
                 placeholder="Enter your account password" 
                 required 
                 autocomplete="current-password">
          <button type="button" class="input-icon-btn password-toggle-btn" data-target="loginPassword" aria-label="Show password">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
              <circle cx="12" cy="12" r="3"></circle>
            </svg>
          </button>
        </div>
      </div>

      <!-- Meta Row: Remember Me & Forgot Password -->
      <div class="auth-meta-row">
        <label class="form-checkbox">
          <input type="checkbox" name="remember_me" id="rememberMe" checked>
          <span>Remember me for 30 days</span>
        </label>
      </div>

      <!-- Submit Button -->
      <button type="submit" class="btn btn-primary btn-block btn-lg" id="submitBtn">
        {% if role == 'admin' %}Sign In as Authority / Admin{% else %}Sign In as Citizen{% endif %}
      </button>

      <!-- Switch to Register -->
      <div class="auth-footer-text">
        Don't have an account yet? 
        <a href="{{ url_for('auth.register', role=role or 'citizen') }}" style="font-weight: 600;">Create Account</a>
      </div>

      <!-- Quick Demo Credentials Box for Testing -->
      <div style="margin-top: 1.5rem; padding: 0.875rem; background: var(--bg-subtle); border-radius: var(--radius-md); font-size: 0.8125rem; border: 1px dashed var(--border-strong);">
        <div style="font-weight: 600; color: var(--text-main); margin-bottom: 0.25rem;">Quick Demo Sign-In:</div>
        <div style="display: flex; gap: 0.5rem; flex-wrap: wrap; margin-top: 0.4rem;">
          <button type="button" class="btn btn-secondary btn-sm" onclick="document.getElementById('roleToggleCitizen').click(); document.getElementById('loginEmail').value='citizen@example.com'; document.getElementById('loginPassword').value='Citizen@123';">
            Fill Citizen Demo
          </button>
          <button type="button" class="btn btn-secondary btn-sm" onclick="document.getElementById('roleToggleAdmin').click(); document.getElementById('loginEmail').value='admin@civicconnects.gov'; document.getElementById('loginPassword').value='Admin@123';">
            Fill Admin Demo
          </button>
        </div>
      </div>

    </form>

  </div>
</div>
{% endblock %}
