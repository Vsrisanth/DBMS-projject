<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Redirecting to Ticket Tracking | Civic Connects</title>
  <script>
    (function() {
      // Extract ticket from hash if present (e.g. #CC-8421)
      const rawHash = window.location.hash || '';
      const cleanTicket = rawHash.replace(/^[#/]+/, '').trim();
      
      if (cleanTicket) {
        window.location.replace('/citizen/track?ticket=' + encodeURIComponent(cleanTicket));
      } else {
        window.location.replace('/citizen/track');
      }
    })();
  </script>
</head>
<body style="font-family: 'Plus Jakarta Sans', sans-serif; display: flex; align-items: center; justify-content: center; min-height: 100vh; background-color: #F8FAFC; color: #64748B; margin: 0;">
  <div style="text-align: center; padding: 2rem;">
    <div style="width: 44px; height: 44px; border-radius: 50%; border: 3px solid #BFDBFE; border-top-color: #2563EB; animation: spin 0.8s linear infinite; margin: 0 auto 1rem auto;"></div>
    <div style="font-size: 1rem; font-weight: 600; color: #0F172A;">Loading grievance tracking timeline...</div>
    <div style="font-size: 0.85rem; color: #94A3B8; margin-top: 0.25rem;">Redirecting to municipal resolution details</div>
  </div>
  <style>
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</body>
</html>
