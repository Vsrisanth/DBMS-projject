<!-- Shared Admin Action / Resolution Modal Component -->
<div class="modal-backdrop" id="complaintActionModal">
  <div class="modal-dialog" role="dialog" aria-modal="true" aria-labelledby="modalTitleHeading">
    <div class="modal-header">
      <div>
        <h3 id="modalTitleHeading" style="font-size: 1.15rem; color: var(--text-main);">
          Manage Grievance <span id="modalTicketNumber" class="ticket-pill"></span>
        </h3>
        <span id="modalCategory" class="badge-category" style="margin-top: 0.25rem;"></span>
      </div>
      <button type="button" class="modal-close-trigger" aria-label="Close modal" style="background: none; border: none; font-size: 1.5rem; cursor: pointer; color: var(--text-muted); line-height: 1;">&times;</button>
    </div>

    <form id="modalUpdateForm" method="POST">
      <div class="modal-body" style="display: flex; flex-direction: column; gap: 1rem;">

        <!-- Citizen Information Summary -->
        <div style="background: var(--bg-canvas); padding: 0.875rem 1rem; border-radius: var(--radius-md); border: 1px solid var(--border-subtle);">
          <div style="font-size: 0.75rem; font-weight: 700; text-transform: uppercase; color: var(--text-muted); margin-bottom: 0.35rem;">
            Complainant Contact &amp; Locality
          </div>
          <div style="font-size: 0.875rem;">
            <strong id="modalCitizenName"></strong> &bull;
            <span id="modalCitizenPhone" style="color: var(--text-muted);"></span> &bull;
            <span id="modalCitizenEmail" style="color: var(--text-muted);"></span>
          </div>
          <div style="font-size: 0.8125rem; color: var(--text-main); margin-top: 0.3rem;">
            <strong>Exact Address:</strong> <span id="modalLocation"></span>
          </div>
        </div>

        <!-- Description Box -->
        <div>
          <div style="font-size: 0.75rem; font-weight: 700; text-transform: uppercase; color: var(--text-muted); margin-bottom: 0.25rem;">
            Grievance Description
          </div>
          <div style="background: var(--bg-canvas); padding: 0.75rem 0.875rem; border-radius: var(--radius-sm); border: 1px solid var(--border-subtle);">
            <div id="modalTitle" style="font-size: 0.9rem; font-weight: 600; color: var(--text-main); margin-bottom: 0.25rem; display: none;"></div>
            <p id="modalDescription" style="font-size: 0.875rem; color: var(--text-main); line-height: 1.5; margin: 0;"></p>
          </div>
        </div>

        <!-- Attached Image Preview Container -->
        <div id="modalImageContainer" style="display: none;"></div>

        <!-- Controls 1 & 2: Status & Department -->
        <div class="modal-form-grid">
          <div class="form-group" style="margin-bottom: 0;">
            <label for="modalStatusSelect" class="form-label">Triage &amp; Update Status <span class="required">*</span></label>
            <select name="status" id="modalStatusSelect" class="form-select" required>
              <option value="pending">Pending (Awaiting Inspection)</option>
              <option value="in_progress">In Progress (Field Crew Dispatched)</option>
              <option value="resolved">Resolved (Repairs Verified &amp; Closed)</option>
              <option value="rejected">Rejected (Out of Municipal Scope)</option>
            </select>
          </div>

          <div class="form-group" style="margin-bottom: 0;">
            <label for="modalDeptSelect" class="form-label">Assign Municipal Department</label>
            <select name="department_id" id="modalDeptSelect" class="form-select">
              <option value="">-- No Department Assigned --</option>
              {% for d in departments %}
                <option value="{{ d.id }}">{{ d.name }}</option>
              {% endfor %}
            </select>
          </div>
        </div>

        <!-- Control 3: Official Remarks & Message to Citizen -->
        <div class="form-group" style="margin-bottom: 0;">
          <label for="modalAdminRemarks" class="form-label">Official Resolution Remarks (Visible to Citizen)</label>
          <textarea name="admin_remarks"
                    id="modalAdminRemarks"
                    rows="3"
                    class="form-control"
                    placeholder="Enter update message regarding this issue, action taken, or resolution remarks to send to the citizen..."></textarea>
          <span class="form-hint" style="display: block; margin-top: 0.25rem; font-size: 0.78rem;">
            This message is sent to the citizen's notifications and shown on their complaint tracker.
          </span>
        </div>

        <!-- Collapsible Update History -->
        <details id="modalHistorySection" style="display: none; background: var(--bg-canvas); padding: 0.75rem 1rem; border-radius: var(--radius-md); border: 1px solid var(--border-subtle);">
          <summary style="cursor: pointer; font-size: 0.8125rem; font-weight: 700; color: var(--text-main);">
            Update History Sent to Citizen (<span id="modalHistoryCount">0</span>)
          </summary>
          <div id="modalHistoryList" style="display: flex; flex-direction: column; gap: 0.5rem; margin-top: 0.75rem;"></div>
        </details>

      </div>

      <div class="modal-footer">
        <button type="button" class="btn btn-secondary modal-close-trigger">Cancel</button>
        <button type="submit" class="btn btn-primary">
          Commit Changes &amp; Notify Citizen
        </button>
      </div>
    </form>
  </div>
</div>
